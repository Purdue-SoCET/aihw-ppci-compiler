name: compiler_validation

# Compile the validation C tests and kernels with this branch's atalla_cc, run them on
# the simulator revision pinned by this commit, and compare against matching
# handwritten kernel. Fails only on accuracy.
on:
  push:
    branches:
      - atalla-arch
  # `branches` filters on the PR's target branch, so this runs for a PR from any
  # branch into atalla-arch (or master).
  pull_request:
    branches:
      - atalla-arch
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: compiler-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler_validation:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The private simulator is checked out at this compiler commit's gitlink.
      - name: Resolve functional_sim revision
        id: sim
        run: echo "sha=$(git rev-parse HEAD:functional_sim)" >> "$GITHUB_OUTPUT"

      - name: Checkout functional_sim
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/atalla-functional-sim
          ref: ${{ steps.sim.outputs.sha }}
          path: functional_sim
          ssh-key: ${{ secrets.FUNCTIONAL_SIM_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify functional_sim revision
        run: |
          test "$(git -C functional_sim rev-parse HEAD)" = "${{ steps.sim.outputs.sha }}"
          echo 'functional_sim: `${{ steps.sim.outputs.sha }}`' >> "$GITHUB_STEP_SUMMARY"

      - name: Install validation dependencies
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e . numpy pydot pytest
          # export the path so subsequent steps can use this venv
          echo "VENV_PATH=$PWD/.venv/bin" >> $GITHUB_ENV

      # asicfab doesn't have "python" in the path, so symlink it to a file and add to path
      - name: Create python shim
        run: |
          mkdir -p $GITHUB_WORKSPACE/local_bin
          ln -s $(which python3.12) $GITHUB_WORKSPACE/local_bin/python
          echo "$GITHUB_WORKSPACE/local_bin" >> $GITHUB_PATH

      - name: Atalla architecture unit tests
        run: |
          source $VENV_PATH/activate
          python -m unittest -v test.arch.test_atalla

      - name: Packetization and control-flow regression tests
        env:
          PYTHONPATH: .:functional_sim
        run: |
          source $VENV_PATH/activate
          python -m pytest -q test/codegen/test_atalla_packetizer.py test/test_validation_report.py \
            test/codegen/test_atalla_masked.py \
            functional_sim/tests/unit/test_packetizer.py \
            functional_sim/tests/unit/test_control_offsets.py \
            functional_sim/tests/unit/test_build_compiler_li.py \
            functional_sim/tests/unit/test_conv_generator.py

      - name: Unit tests (x10 checks)
        id: unit
        continue-on-error: true
        run: |
          source $VENV_PATH/activate
          python test_validation/run_all_validation.py --json validation_results/unit.json

      - name: Restore macro baseline (atalla-arch)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: validation_results/baseline_atalla_arch.json
          key: compiler-perf-atalla-arch-${{ github.run_id }}
          restore-keys: |
            compiler-perf-atalla-arch-

      - name: Restore micro baseline (previous commit)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: validation_results/baseline_prev.json
          key: compiler-perf-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            compiler-perf-${{ github.head_ref || github.ref_name }}-

      - name: Restore legacy benchmark results fallback
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: validation_results/previous.json
          key: compiler-perf-legacy-${{ github.run_id }}
          restore-keys: |
            compiler-perf-atalla-arch-
            compiler-perf-${{ github.head_ref || github.ref_name }}-

      - name: Migrate baseline files if needed
        run: |
          mkdir -p validation_results
          if [ ! -f validation_results/baseline_atalla_arch.json ]; then
            if [ -f ci/baselines/baseline_atalla_arch.json ]; then
              cp ci/baselines/baseline_atalla_arch.json validation_results/baseline_atalla_arch.json
            elif [ -f validation_results/previous.json ]; then
              cp validation_results/previous.json validation_results/baseline_atalla_arch.json
            fi
          fi
          if [ ! -f validation_results/baseline_prev.json ] && [ -f validation_results/previous.json ]; then
            cp validation_results/previous.json validation_results/baseline_prev.json
          fi

      - name: Kernels (numeric goldens + handwritten comparison)
        id: kernels
        continue-on-error: true
        run: |
          source $VENV_PATH/activate
          python test_validation_kernels/run_kernel_validation.py --json validation_results/kernel.json

      - name: Write report
        if: always()
        run: |
          source $VENV_PATH/activate
          python ci/validation_report.py \
            --unit validation_results/unit.json \
            --kernel validation_results/kernel.json \
            --macro-baseline validation_results/baseline_atalla_arch.json \
            --micro-baseline validation_results/baseline_prev.json \
            --csv validation_results/kernel_metrics.csv \
            --out validation_results/report.md

      - name: Post PR Summary Comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'validation_results/report.md';
            if (!fs.existsSync(reportPath)) {
              console.log('No report.md found at ' + reportPath);
              return;
            }
            const body = fs.readFileSync(reportPath, 'utf8');
            const marker = '<!-- compiler-validation-report -->';
            const commentBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.body && comment.body.includes(marker)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
              console.log(`Updated existing PR comment ${botComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
              console.log('Created new PR comment');
            }

      - name: Prepare benchmark cache for next run
        if: always()
        run: |
          mkdir -p validation_results
          if [ -f validation_results/kernel.json ]; then
            cp validation_results/kernel.json validation_results/baseline_prev.json
            if [ "${{ github.ref_name }}" = "atalla-arch" ]; then
              cp validation_results/kernel.json validation_results/baseline_atalla_arch.json
            fi
          fi

      - name: Save micro benchmark cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: validation_results/baseline_prev.json
          key: compiler-perf-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}

      - name: Save macro benchmark cache (atalla-arch only)
        if: always() && github.ref_name == 'atalla-arch'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: validation_results/baseline_atalla_arch.json
          key: compiler-perf-atalla-arch-${{ github.run_id }}

      - name: Stage artifacts for upload
        if: always()
        run: |
          mkdir -p staging_area/validation_results
          mkdir -p staging_area/test_validation_out
          mkdir -p staging_area/test_kernels_out

          cp -r validation_results/* staging_area/validation_results/
          cp -r test_validation/out/* staging_area/test_validation_out/
          
          # skip handwritten
          find test_validation_kernels/out/ -maxdepth 1 -type d ! -name "handwritten" ! -name "." -exec cp -r {} staging_area/test_kernels_out/ \;

      - name: Upload report and per-kernel artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: compiler-validation-${{ github.run_number }}
          retention-days: 14
          path: staging_area/ 

      - name: Accuracy gate
        if: always()
        run: |
          echo "unit: ${{ steps.unit.outcome }}, kernels: ${{ steps.kernels.outcome }}"
          test "${{ steps.unit.outcome }}" = "success" && test "${{ steps.kernels.outcome }}" = "success"
