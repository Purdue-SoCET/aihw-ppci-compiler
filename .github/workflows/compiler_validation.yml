name: compiler_validation

# Compile the validation C tests and kernels with this branch's atalla_cc, run them on
# the latest functional simulator from the branch named in .gitmodules
# (submodule.functional_sim.branch), and compare each kernel against the matching
# handwritten kernel. Fails only on accuracy.
on:
  push:
    branches:
      - atalla-arch
  # `branches` filters on the PR's target branch, so this runs for a PR from any
  # branch into atalla-arch (or master).
  pull_request:
    branches:
      - atalla-arch
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: compiler-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler_validation:
    runs-on: ${{ github.repository_owner == 'SoCETOrganization' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # atalla-functional-sim is private, so GITHUB_TOKEN can't clone the submodule.
      # A read-only deploy key on that repo (secret FUNCTIONAL_SIM_DEPLOY_KEY) is used
      # to check out the tip of the sim branch named in .gitmodules.
      - name: Resolve functional_sim branch
        id: sim
        env:
          DEPLOY_KEY: ${{ secrets.FUNCTIONAL_SIM_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Secret FUNCTIONAL_SIM_DEPLOY_KEY is not available (missing, or a PR from a fork)."
            exit 1
          fi
          branch=$(git config -f .gitmodules submodule.functional_sim.branch)
          if [ -z "$branch" ]; then
            echo "::error::.gitmodules has no branch for submodule functional_sim."
            exit 1
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout functional_sim branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/atalla-functional-sim
          ref: ${{ steps.sim.outputs.branch }}
          path: functional_sim
          ssh-key: ${{ secrets.FUNCTIONAL_SIM_DEPLOY_KEY }}
          persist-credentials: false

      # The branch tip moves independently of this repo, so record which sim commit
      # these results came from.
      - name: Record functional_sim commit
        run: |
          sim_sha=$(git -C functional_sim rev-parse HEAD)
          pinned=$(git rev-parse HEAD:functional_sim)
          echo "functional_sim ${{ steps.sim.outputs.branch }} @ $sim_sha (submodule pointer: $pinned)"
          {
            echo "functional_sim: \`${{ steps.sim.outputs.branch }}\` at \`${sim_sha:0:8}\`"
            if [ "$sim_sha" != "$pinned" ]; then
              echo "(submodule pointer in this commit is \`${pinned:0:8}\`)"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Ensure Python environment
        run: |
          if ! command -v python &> /dev/null || ! python -c "import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)" 2>/dev/null; then
            PYTHON_BIN=$(which python3.12 || which python3.11 || which python3.10 || which python3)
            echo "Initializing virtualenv from $PYTHON_BIN"
            $PYTHON_BIN -m venv "$HOME/validation_venv"
            echo "$HOME/validation_venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . numpy pydot

      - name: Atalla architecture unit tests
        run: python -m unittest -v test.arch.test_atalla

      - name: Unit tests (x10 checks)
        id: unit
        continue-on-error: true
        run: python test_validation/run_all_validation.py --json validation_results/unit.json

      - name: Restore macro baseline (atalla-arch)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: validation_results/baseline_atalla_arch.json
          key: compiler-perf-atalla-arch-${{ github.run_id }}
          restore-keys: |
            compiler-perf-atalla-arch-

      - name: Restore micro baseline (previous commit)
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: validation_results/baseline_prev.json
          key: compiler-perf-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            compiler-perf-${{ github.head_ref || github.ref_name }}-

      - name: Restore legacy benchmark results fallback
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: validation_results/previous.json
          key: compiler-perf-legacy-${{ github.run_id }}
          restore-keys: |
            compiler-perf-atalla-arch-
            compiler-perf-${{ github.head_ref || github.ref_name }}-

      - name: Migrate baseline files if needed
        run: |
          mkdir -p validation_results
          if [ ! -f validation_results/baseline_atalla_arch.json ]; then
            if [ -f ci/baselines/baseline_atalla_arch.json ]; then
              cp ci/baselines/baseline_atalla_arch.json validation_results/baseline_atalla_arch.json
            elif [ -f validation_results/previous.json ]; then
              cp validation_results/previous.json validation_results/baseline_atalla_arch.json
            fi
          fi
          if [ ! -f validation_results/baseline_prev.json ] && [ -f validation_results/previous.json ]; then
            cp validation_results/previous.json validation_results/baseline_prev.json
          fi

      - name: Kernels (numeric goldens + handwritten comparison)
        id: kernels
        continue-on-error: true
        run: python test_validation_kernels/run_kernel_validation.py --json validation_results/kernel.json

      - name: Write report
        if: always()
        run: |
          python ci/validation_report.py \
            --unit validation_results/unit.json \
            --kernel validation_results/kernel.json \
            --macro-baseline validation_results/baseline_atalla_arch.json \
            --micro-baseline validation_results/baseline_prev.json \
            --csv validation_results/kernel_metrics.csv \
            --out validation_results/report.md

      - name: Post PR Summary Comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'validation_results/report.md';
            if (!fs.existsSync(reportPath)) {
              console.log('No report.md found at ' + reportPath);
              return;
            }
            const body = fs.readFileSync(reportPath, 'utf8');
            const marker = '<!-- compiler-validation-report -->';
            const commentBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.body && comment.body.includes(marker)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody,
              });
              console.log(`Updated existing PR comment ${botComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
              console.log('Created new PR comment');
            }

      - name: Prepare benchmark cache for next run
        if: always()
        run: |
          mkdir -p validation_results
          if [ -f validation_results/kernel.json ]; then
            cp validation_results/kernel.json validation_results/baseline_prev.json
            if [ "${{ github.ref_name }}" = "atalla-arch" ]; then
              cp validation_results/kernel.json validation_results/baseline_atalla_arch.json
            fi
          fi

      - name: Save micro benchmark cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: validation_results/baseline_prev.json
          key: compiler-perf-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}

      - name: Save macro benchmark cache (atalla-arch only)
        if: always() && github.ref_name == 'atalla-arch'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: validation_results/baseline_atalla_arch.json
          key: compiler-perf-atalla-arch-${{ github.run_id }}

      - name: Upload report and per-kernel artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: compiler-validation-${{ github.run_number }}
          retention-days: 14
          # This repo is public but functional_sim is private: don't publish the
          # handwritten kernels' generated asm/images.
          path: |
            validation_results/
            test_validation/out/
            test_validation_kernels/out/
            !test_validation_kernels/out/*/handwritten/

      - name: Accuracy gate
        if: always()
        run: |
          echo "unit: ${{ steps.unit.outcome }}, kernels: ${{ steps.kernels.outcome }}"
          test "${{ steps.unit.outcome }}" = "success" && test "${{ steps.kernels.outcome }}" = "success"
